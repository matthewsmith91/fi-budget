# Publishes a GitHub Release for a version tag. The app's Settings > Updates card compares the
# running version with `releases/latest`, so a release here is what tells a household its server
# is behind. Make one from a clean main:
#
#   npm version minor -m "Release %s"   # bumps the root package.json and tags v<version>
#   git push --follow-tags
#
# A tag with a hyphen (v0.3.0-beta.1) becomes a pre-release, which the app never offers.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $pre
